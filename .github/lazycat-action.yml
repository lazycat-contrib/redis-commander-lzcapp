version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/redis-commander.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: redis-commander
    bump: patch
build:
  run_buildscript: false
images:
  # 辅助 redis：跟随 7.x-alpine 家族（固定补丁家族）
  - id: redis
    target: service
    service: redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: '^7\.\d+-alpine$'
    version_regex: '^(?P<version>7\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat
  # 主应用：上游仅发布 mutable latest（无 semver 家族）→ bump: patch
  - id: redis-commander
    target: service
    service: redis-commander
    source: rediscommander/redis-commander
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Redis Commander
    summary: "Redis Web 端管理工具"
